name: "yolo_tile_bytetrack"
description: "YOLO12s with tile-based detection + ByteTrack for small object tracking"

detector:
  type: "yolo_tile_bytetrack"
  model_name: "yolo12s"
  conf_threshold: 0.01                 # Very permissive for tiny objects
  tile_size: 1080
  overlap: 32
  params:
    filter_class: 14                   # Detect bird class
    detect_all_classes: false
    nms_threshold: 0.3
    img_size: 640                      # Keep YOLO at 640

tracker:
  type: "bytetrack"
  params:
    max_age: 10            # allow short occlusions/missed frames
    min_hits: 1            # quick track confirmation
    iou_threshold: 0.1     # small boxes ⇒ low IoU
    high_thresh: 0.08      # high-confidence split
    low_thresh: 0.001      # keep low-score boxes for second stage
