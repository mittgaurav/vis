name: "yolo_tile_bytetrack"
description: "YOLO12s with tile-based detection + ByteTrack for small object tracking"

detector:
  type: "yolo_tile_bytetrack"
  model_name: "yolo12s"
  conf_threshold: 0.001                # Very permissive for tiny objects
  tile_size: 1024                      # Process 1024×1024 tiles
  overlap: 256                         # 256-pixel overlap between tiles
  params:
    filter_class: 14                   # Detect bird class
    detect_all_classes: false
    nms_threshold: 0.3
    img_size: 640                      # Keep YOLO at 640

tracker:
  type: "bytetrack"
  params:
    max_age: 10                        # Keep unmatched tracks for 10 frames
    min_hits: 1                        # Confirm track on first detection
    iou_threshold: 0.1                 # Very loose matching for fast-moving objects
    high_thresh: 0.5                   # High-confidence detections (first stage)
    low_thresh: 0.05                   # Low-confidence detections (second stage)
    buffer_size: 30                    # Track buffer size
