# YOLO + SORT DEFAULT CONFIGURATION (COCO baseline)

name: "yolo_ocsort_coco_baseline"
description: "YOLOv12s + OCSORT with COCO default parameters - untuned baseline"

detector:
  type: "yolo_ocsort"
  model_name: "yolo12s"
  conf_threshold: 0.25          # COCO default
  params:
    filter_class: null           # No class filtering (default)
    detect_all_classes: false
    nms_threshold: 0.45         # COCO default
    img_size: 640               # YOLO default input size

tracker:
  type: "ocsort"                   # Standard SORT (not OC-SORT)
  params:
    max_age: 1                  # Default: strict occlusion handling
    min_hits: 3                 # Default: requires multiple confirmations
    iou_threshold: 0.3          # Standard IoU threshold
    lambda_dist: 0.98     # weight on IoU vs center-distance in OC-SORT cost
