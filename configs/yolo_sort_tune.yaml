# YOLO + SORT DEFAULT CONFIGURATION (COCO baseline)

name: "yolo_sort_tune"
description: "YOLOv12s + SORT with COCO default parameters - untuned baseline"

detector:
  type: "yolo_sort"
  model_name: "yolo12s"
  conf_threshold: 0.005
  params:
    filter_class: 14
    detect_all_classes: false
    nms_threshold: 0.3
    img_size: 640              # Keep YOLO at 640, tile handling size

tracker:
  type: "sort"
  params:
    max_age: 10
    min_hits: 1
    iou_threshold: 0.1
